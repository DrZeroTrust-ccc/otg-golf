name: Weekly events form check
# Mondays 13:00 UTC = 9am US Eastern (8am in winter). No Claude involved; plain Node script.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["monitor/**", ".github/workflows/weekly-form-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node monitor/form_check.mjs
        env:
          OTG_READ_KEY: ${{ secrets.OTG_READ_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          OWNER_ALERT_PHONE: ${{ secrets.OWNER_ALERT_PHONE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
